packages:
  - "apps/*"
  - "packages/*"
  - "tooling/*"

# Single source of truth for versions shared across two or more packages
# (or a family of packages that must move together, e.g. all @orpc/*).
# A lib pinned in exactly one package.json stays inline there.
catalog:
  typescript: "^5"
  eslint: "^9"
  zod: "^4.4.3"
  react: "19.2.4"
  react-dom: "19.2.4"
  vitest: "^4.1.10"
  "@types/node": "^20"
  "@types/react": "^19"
  "@types/react-dom": "^19"
  "@tailwindcss/postcss": "^4"
  better-auth: "^1.6.27"
  "@better-auth/drizzle-adapter": "^1.6.27"
  "@better-auth/core": "^1.6.27"
  auth: "^1.6.27"
  lucide-react: "^1.28.0"
  next-themes: "^0.4.6"
  drizzle-orm: "1.0.0-rc.4"
  drizzle-kit: "1.0.0-rc.4"
  server-only: "^0.0.1"
  "@t3-oss/env-core": "^0.13.11"
  "@orpc/client": "^1.15.0"
  "@orpc/server": "^1.15.0"
  "@orpc/contract": "^1.15.0"
  "@orpc/openapi": "^1.15.0"
  "@orpc/tanstack-query": "^1.15.0"
  "@orpc/zod": "^1.15.0"

allowBuilds:
  sharp: true
  unrs-resolver: true

# Better Auth still declares `drizzle-orm: ^0.45.2` as a peer, but this repo
# pins drizzle-orm 1.0.0-rc.4. Verified compatible — see docs/architecture.md
# S10 (C1, C10).
peerDependencyRules:
  allowedVersions:
    drizzle-orm: "1.0.0-rc.4"
